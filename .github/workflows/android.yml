name: Build Android APK

on:
  push:
    branches:
      - main
      - native/**
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

          # GitHub's Ubuntu 24.04 image exposes API 37 as android-37.0,
          # while older Android tooling may still resolve the target as android-37.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -e "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pt-local-music-player-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
